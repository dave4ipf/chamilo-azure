name: Deploy Chamilo to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: mbstring, xml, ctype, iconv, mysql, gd, intl, zip
        tools: composer

    - name: Install PHP dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-scripts
        # Manually install assets since we used --no-scripts
        php bin/console assets:install public

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install JS dependencies
      run: npm install

    - name: Build frontend
      run: npm run build

    - name: Cleanup before deployment
      run: |
        rm -rf node_modules
        rm -rf .git
        rm -rf assets
        rm -rf tests
        rm -f *.zip
        rm -f hostingstart.html
        # Ensure var directory is clean but exists
        rm -rf var/cache/*
        mkdir -p var/log

    - name: Login to Azure (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'ipfl-training-academy'
        package: .


