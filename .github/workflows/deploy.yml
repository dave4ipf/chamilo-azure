name: Deploy Chamilo to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: mbstring, xml, ctype, iconv, mysql, gd, intl, zip
        tools: composer

    - name: Install PHP dependencies
      run: |
        composer install --no-dev --optimize-autoloader --no-scripts
        # Provide dummy env vars to allow Symfony to boot without a database
        export DATABASE_HOST=127.0.0.1
        export DATABASE_PORT=3306
        export DATABASE_NAME=temp
        export DATABASE_USER=temp
        export DATABASE_PASSWORD=temp
        export APP_SECRET=temp
        export APP_ENV=prod
        php bin/console assets:install public

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install JS dependencies
      run: npm install

    - name: Build frontend
      run: npm run build

    - name: Cleanup and Warmup
      run: |
        # Remove source/build artifacts we don't need in prod
        rm -rf node_modules || true
        rm -rf .git || true
        rm -rf assets || true
        rm -rf tests || true
        rm -f *.zip || true
        rm -f hostingstart.html || true

        # Remove placeholder envs so they don't interfere
        rm -f .env || true
        rm -f .env.dist || true
        rm -f .env.test || true

        # Clean cache first
        rm -rf var/cache/* || true
        mkdir -p var/log
        touch var/log/.gitkeep

        # Warm up cache (Generates Doctrine Proxies)
        # We need these dummy vars so the Symfony kernel can boot
        export DATABASE_HOST=127.0.0.1
        export DATABASE_PORT=3306
        export DATABASE_NAME=temp
        export DATABASE_USER=temp
        export DATABASE_PASSWORD=temp
        export APP_SECRET=temp
        export APP_ENV=prod
        php bin/console cache:warmup --env=prod

    - name: Login to Azure (OIDC)

      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'ipfl-training-academy'
        package: .


